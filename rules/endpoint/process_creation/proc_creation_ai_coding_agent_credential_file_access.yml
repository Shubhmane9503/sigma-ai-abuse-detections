title: AI Coding Agent Child Process Command Line References Credential Files
id: 30d72208-8b1b-4e1a-9ed5-f0efddcecba1
status: experimental
description: |
    Detects a process started by a coding agent (usually the shell the agent uses to run tool
    commands) whose command line references well-known credential stores: cloud provider credential
    files, SSH private keys, kubeconfig, Docker, npm, PyPI, netrc and git credential files.
    Prompt injection (through a repository, issue, web page or MCP tool output) or a malicious MCP server can
    steer an agent into reading secrets and sending them out through its next tool call or model request.
    Legitimate coding tasks rarely need to print these files.
    Visibility limit: this rule only sees the command lines of processes the agent spawns. Agents also
    read files in-process with their built-in file tools (Claude Code's Read tool, Codex and Gemini file
    APIs), and those reads create no child process and are invisible here. Use file-access telemetry
    (auditd, EDR file events, macOS Endpoint Security) on the credential paths to cover them.
    SSH keys: only the default private key names (id_rsa, id_ed25519, id_ecdsa, id_dsa and the _sk
    variants) are matched when followed by a shell separator, so public keys (*.pub) do not alert.
    Not covered: custom-named keys, globs (~/.ssh/id_*, ~/.ssh/*), brace expansion
    (~/.ssh/{id_rsa,id_ed25519}) and archiving the whole directory (tar ~/.ssh). File-access telemetry
    on ~/.ssh covers those.
    Agents are identified by parent image (native binaries) or parent command line (Node.js-hosted agents).
    Agent identifiers last verified 2026-09-25 (Claude Code 2.1.282, Codex CLI 0.157.0, Gemini CLI 0.61.0,
    GitHub Copilot CLI 1.0.88).
    Log format assumption: Sysmon-style process creation events (ParentImage, ParentCommandLine, CommandLine),
    Windows, Linux or macOS.
    Allowlist hook: filters/proc_creation_ai_coding_agent_credential_file_access_allowlist.yml.
references:
    - https://atlas.mitre.org/techniques/AML.T0098
    - https://attack.mitre.org/techniques/T1552/001/
    - https://github.com/Agent-Threat-Rule/agent-threat-rules
author: Shubham Mane
date: 2026-09-25
modified: 2026-09-27
tags:
    - attack.credential-access
    - attack.t1552.001
atlas:
    - AML.T0098
logsource:
    category: process_creation
detection:
    selection_parent:
        - ParentImage|endswith:
              - /claude
              - \claude.exe
              - /codex
              - \codex.exe
              - /gemini
              - \gemini.exe
              - /copilot
              - \copilot.exe
              - /cursor-agent
        # Native Claude Code installs run from <data dir>/claude/versions/<version>
        - ParentImage|contains:
              - /claude/versions/
              - \claude\versions\
        - ParentCommandLine|contains:
              - '@anthropic-ai/claude-code'
              - '@anthropic-ai\claude-code'
              - '@openai/codex'
              - '@openai\codex'
              - '@google/gemini-cli'
              - '@google\gemini-cli'
              - /bin/gemini
              - '@github/copilot'
              - '@github\copilot'
              - /bin/copilot
              - cursor-agent
    cred_files:
        CommandLine|contains:
            - .aws/credentials
            - .aws\credentials
            - .azure/msal_token_cache
            - .azure\msal_token_cache
            - .azure/accessTokens.json
            - .azure\accessTokens.json
            - gcloud/credentials.db
            - gcloud\credentials.db
            - gcloud/application_default_credentials.json
            - gcloud\application_default_credentials.json
            - gcloud/legacy_credentials
            - gcloud\legacy_credentials
            - .kube/config
            - .kube\config
            - .docker/config.json
            - .docker\config.json
            - .git-credentials
            - .netrc
            - .npmrc
            - .pypirc
    cred_ssh_private_key:
