    condition: selection_parent and 1 of cred_*
falsepositives:
    - A developer explicitly asking the agent to debug their cloud, SSH or registry configuration. Confirm with the user.
    - Agent-driven setup scripts that write (not read) these files, for example "aws configure" run by the agent. Review the command line.
    - >-
      Routine tool use that names a credential file, for example an agent running "kubectl --kubeconfig ~/.kube/config get pods". This is not excluded, because
      an exclusion keyed on kubectl would also hide "kubectl config view --raw" style dumps. Tune by user or host in the allowlist filter.
level: high
