title: AWS Bedrock Model Invocation
id: 7e8c1646-c28f-4b13-bfa8-2ea3cc37024f
name: aws_bedrock_model_invocation
status: experimental
description: |
    Base rule for the multi-region Bedrock invocation correlation below. Selects Bedrock runtime inference
    calls recorded in CloudTrail. On its own this rule is far too noisy to alert on, so it is used
    only as input to the correlation rule.
    Log format assumption: raw CloudTrail JSON records.
references:
    - https://stratus-red-team.cloud/attack-techniques/AWS/aws.impact.bedrock-invoke-model/
    - https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
author: Shubham Mane
date: 2026-09-25
modified: 2026-09-25
tags:
    - attack.initial-access
    - attack.t1078.004
atlas:
    - AML.T0040
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: bedrock.amazonaws.com
        eventName:
            - InvokeModel
            - InvokeModelWithResponseStream
            - Converse
            - ConverseStream
    condition: selection
falsepositives:
    - Every legitimate Bedrock inference call. Not intended to alert on its own.
level: informational
