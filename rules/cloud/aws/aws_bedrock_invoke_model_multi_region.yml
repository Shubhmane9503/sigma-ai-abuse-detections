title: AWS Bedrock Model Invoked From Three Or More Regions By One Identity Within One Hour
id: 48136d7c-fcf0-43ce-ad6d-25c92fd7218f
status: experimental
description: |
    Detects a single AWS identity invoking Amazon Bedrock models in three or more distinct AWS regions
    within one hour. LLMjacking operators spread inference across regions to get around per-region
    quotas and to use models that are only offered in some regions, while legitimate
    applications are usually pinned to one or two regions (or use a cross-region inference profile
    called from a single home region).
    Correlation: value_count of awsRegion grouped by userIdentity.arn over a 1 hour timespan, threshold 3.
    Scheduling: the committed Splunk query uses a sliding window (streamstats time_window=1h). The
    committed ES|QL query has no time bucket: schedule it every 5-10 minutes with a 60-minute lookback,
    so a burst that straddles an hour boundary (for example 03:50, 03:52, 04:10) is still counted
    together. The ES|QL query is for scheduled detection only: run ad hoc over a range longer than
    one hour it counts regions across the whole range and alerts on slow, legitimate multi-region use
    (such as the repository's batch-eval window-negative). Both behaviours are covered by the tests
    (docs/testing.md).
    Allowlist hook: filters/aws_bedrock_invoke_model_multi_region_allowlist.yml (applied to the base rule).
references:
    - https://stratus-red-team.cloud/attack-techniques/AWS/aws.impact.bedrock-invoke-model/
    - https://sysdig.com/blog/growing-dangers-of-llmjacking/
    - https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
author: Shubham Mane
date: 2026-09-25
modified: 2026-09-27
tags:
    - attack.initial-access
    - attack.t1078.004
atlas:
    - AML.T0040
correlation:
    type: value_count
    rules:
        - aws_bedrock_model_invocation
    group-by:
        - userIdentity.arn
    timespan: 1h
    condition:
        gte: 3
        field: awsRegion
falsepositives:
    - >-
      Global applications that deliberately call Bedrock in several regions from one role (for example a multi-region failover design). Add the role to the
      allowlist filter.
    - Model evaluation or benchmarking jobs that iterate over regions.
level: high
