title: System Prompt Canary Token Returned In LLM Output
id: fd16f09c-e2f8-40d2-9184-7c394d5e0611
status: experimental
description: |
    Detects a canary token planted in an LLM application's system prompt appearing in the model's output,
    which shows that the system prompt was leaked, typically through prompt injection or a
    jailbreak. The canary is a unique string embedded in the system prompt (for example in a comment the
    model is told never to repeat). It has no reason to ever appear in a response.
    Canary convention: tokens start with the prefix "SPCANARY-" followed by a secret random value. This
    rule on its own matches the public prefix, which anyone can make a model print, so deploy it with
    the deployment token filter filters/llm_gateway_system_prompt_canary_in_output_tokens.yml. That filter
    holds your own tokens (kept private) and ignores requests whose input already contained the token.
    Only the model output field is inspected. The token in the system instructions or the input does
    not match.
    Limitations: exact substring matching only. A model coaxed into encoding the prompt (base64, spacing
    or separators between characters, translation, paraphrase) leaks it without the literal token.
    Planting several differently formatted canaries raises the bar but does not remove this gap.
    Log format assumption: LLM gateway or application logs carrying OpenTelemetry GenAI semantic
    convention attributes, with gen_ai.output.messages recorded as a JSON string. There is no Splunk or
    ES|QL pipeline for this log source: the committed queries use these attribute names on all indexes.
    No ATT&CK mapping exists for this behaviour. It is mapped to ATLAS only.
    Allowlist hook: filters/llm_gateway_system_prompt_canary_in_output_allowlist.yml (for example
    canary self-test traffic).
references:
    - https://atlas.mitre.org/techniques/AML.T0056
    - https://github.com/open-telemetry/semantic-conventions-genai
    - https://opentelemetry.io/docs/specs/semconv/gen-ai/gen-ai-spans/
author: Shubham Mane
date: 2026-09-25
modified: 2026-09-26
atlas:
    - AML.T0056
logsource:
    category: application
    product: llm_gateway
detection:
    selection:
        gen_ai.output.messages|contains: SPCANARY-
    condition: selection
falsepositives:
    - Scheduled canary self-tests that deliberately make the model echo the token. Add their service or conversation identifiers to the allowlist filter.
    - Applications that show the system prompt to users on purpose (the canary should not be planted there).
    - Without the deployment token filter, anyone who makes the model print the SPCANARY- prefix.
level: medium
